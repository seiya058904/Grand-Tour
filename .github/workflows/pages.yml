name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '**/readme-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify V26 presentation gates and V25 static baselines
        run: |
          python3 tests/v25/static_verify.py --out "$RUNNER_TEMP/static.json"
          node tests/v26/core-parity.cjs Grand-Tour-V25.html Grand-Tour-V26.html "$RUNNER_TEMP/core.json"
          node tests/v26/focused.cjs Grand-Tour-V26.html archive/v22/Grand-Tour-V22.html "$RUNNER_TEMP/focused.json"
          node tests/v24/save-finish-boundary.cjs Grand-Tour-V26.html "$RUNNER_TEMP/boundary.json"
          node tests/v26/ceremony.cjs Grand-Tour-V26.html "$RUNNER_TEMP/ceremony.json"

      - name: Prepare the published site
        run: |
          mkdir -p _site
          cp index.html Grand-Tour-V26.html Grand-Tour-V25.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
