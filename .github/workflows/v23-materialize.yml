name: Materialize reviewed V23 repair
on:
  push:
    branches: ['fix/v23-progress-ownership-gc']
    paths: ['.github/workflows/v23-materialize.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'seiya058904/Grand-Tour' && github.ref == 'refs/heads/fix/v23-progress-ownership-gc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify baseline and exact final tree, then publish only repair branch
        shell: bash
        run: |
          set -euo pipefail
          branch='refs/heads/fix/v23-progress-ownership-gc'
          base='fe46080950eb1d3215ed631afe1a4a49e58fae90'
          test "$GITHUB_REF" = "$branch"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$base" HEAD
          git apply --check .gt-publication.patch
          git apply .gt-publication.patch
          printf '%s  %s\n' '7661bf115f5ea09c584db7219428706876c02588075c36b9dd340e563cadd260' 'Grand-Tour-V23.html' | sha256sum --check
          git rm .gt-publication.patch .github/workflows/v23-materialize.yml
          git add Grand-Tour-V23.html tests/v23 .github/workflows/v23-verify.yml
          test "$(git write-tree)" = '3b5d40e5fa57d896a5832fb9d85177679484b3a1'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v23): materialize reviewed progress ownership and GC repair'
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$branch"
          printf 'FINAL_COMMIT=%s\nFINAL_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
