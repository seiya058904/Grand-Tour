name: Grand Tour regression verification
on:
  push:
    branches: [main]
    paths: ['archive/v22/Grand-Tour-V22.html', 'archive/v23/Grand-Tour-V23.html', 'Grand-Tour-V24.html', 'Grand-Tour-V24-Final.zip', 'index.html', 'tests/v22/**', 'tests/v23/**', 'tests/v24/**', '.github/workflows/v23-verify.yml']
  pull_request:
    paths: ['archive/v22/Grand-Tour-V22.html', 'archive/v23/Grand-Tour-V23.html', 'Grand-Tour-V24.html', 'Grand-Tour-V24-Final.zip', 'index.html', 'tests/v22/**', 'tests/v23/**', 'tests/v24/**', '.github/workflows/v23-verify.yml']
permissions:
  contents: read
jobs:
  v23:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/gt-evidence
          python tests/v23/static_verify.py --out /tmp/gt-evidence/static.json
          node tests/v23/focused.cjs archive/v23/Grand-Tour-V23.html archive/v22/Grand-Tour-V22.html /tmp/gt-evidence/focused.json
          node tests/v23/storage-ownership.cjs
          node tests/v23/ttt-wheel.cjs archive/v23/Grand-Tour-V23.html /tmp/gt-evidence/ttt-wheel.json
          node tests/v23/tour-simulation.cjs archive/v23/Grand-Tour-V23.html /tmp/gt-evidence/tour.json 314159
      - run: |
          python -m http.server 4187 > /tmp/gt-evidence/server.log 2>&1 &
          python tests/v23/storage-browser.py
          python tests/v23/ttt-wheel-browser.py --out /tmp/gt-evidence/ttt-browser
          python tests/v23/browser_verify.py --out /tmp/gt-evidence/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23-verification
          path: /tmp/gt-evidence
  v24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify V24 core, saves and complete Tour parity
        run: |
          mkdir -p /tmp/gt-v24-evidence
          python tests/v24/static_verify.py --out /tmp/gt-v24-evidence/static.json
          node tests/v24/core-parity.cjs archive/v23/Grand-Tour-V23.html Grand-Tour-V24.html /tmp/gt-v24-evidence/core-parity.json
          node tests/v24/focused.cjs Grand-Tour-V24.html archive/v22/Grand-Tour-V22.html /tmp/gt-v24-evidence/focused.json
          node tests/v24/save-finish-boundary.cjs Grand-Tour-V24.html /tmp/gt-v24-evidence/save-finish-boundary.json
          node tests/v23/storage-ownership.cjs Grand-Tour-V24.html
          node tests/v23/ttt-wheel.cjs Grand-Tour-V24.html /tmp/gt-v24-evidence/ttt-wheel.json
          node tests/v23/tour-simulation.cjs archive/v23/Grand-Tour-V23.html /tmp/gt-v24-evidence/baseline.json 314159
          node tests/v23/tour-simulation.cjs Grand-Tour-V24.html /tmp/gt-v24-evidence/v24.json 314159
          node <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const read = name => JSON.parse(fs.readFileSync('/tmp/gt-v24-evidence/' + name, 'utf8'));
          assert.deepEqual(read('v24-tour.json'), read('baseline-tour.json'));
          console.log('PASS all 21 stages and complete V9 Tour store match V23');
          JS
      - name: Verify retained V24 browser and presentation
        run: |
          python -m http.server 4187 --bind 127.0.0.1 > /tmp/gt-v24-evidence/server.log 2>&1 &
          python tests/v24/storage-browser.py --out /tmp/gt-v24-evidence/storage
          python tests/v24/save-finish-browser.py --out /tmp/gt-v24-evidence/save-finish-browser
          python tests/v24/browser_verify.py --out /tmp/gt-v24-evidence/browser
          python tests/v24/presentation_verify.py --out /tmp/gt-v24-evidence/ui
          python tests/v24/sequence_verify.py --record /tmp/gt-v24-evidence/browser/stage-05-physical.json --tour /tmp/gt-v24-evidence/v24-tour.json --out /tmp/gt-v24-evidence/sequence
      - name: Verify historical V24 package when its sealed input is available
        if: ${{ hashFiles('Grand-Tour-V24-Final.zip') != '' }}
        run: |
          python tests/v24/build_candidate.py --out /tmp/gt-v24-evidence/Grand-Tour-V24-candidate.zip
          python tests/v24/package_verify.py /tmp/gt-v24-evidence/Grand-Tour-V24-candidate.zip --out /tmp/gt-v24-evidence/package
      - name: Explain omitted historical package input
        if: ${{ hashFiles('Grand-Tour-V24-Final.zip') == '' }}
        run: echo 'SKIP historical V24 package reconstruction — the cloud handoff intentionally omits its sealed ZIP; V25 has its own source packager.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v24-verification
          path: /tmp/gt-v24-evidence
