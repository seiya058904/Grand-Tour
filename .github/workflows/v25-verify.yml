name: Grand Tour V25 candidate verification
# Documentation-only changes (README, AGENTS, handoff and V25 report files) no longer start this
# run: the verification reads none of them except to list them in the source package.
# The two complete-Tour simulations are independent, so they run in parallel jobs and the
# comparison and browser checks start as soon as their inputs exist.
on:
  workflow_dispatch:
  push:
    paths: ['Grand-Tour-V25.html', 'Grand-Tour-V24.html', 'index.html', 'tests/**', 'archive/**', '.github/workflows/v25-verify.yml']
  pull_request:
    paths: ['Grand-Tour-V25.html', 'Grand-Tour-V24.html', 'index.html', 'tests/**', 'archive/**', '.github/workflows/v25-verify.yml']
permissions:
  contents: read
concurrency:
  group: gt-v25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - name: Exact baseline, engine and storage gates
        run: |
          mkdir -p /tmp/gt-v25-evidence
          python tests/v25/static_verify.py --out /tmp/gt-v25-evidence/static.json
          node tests/v25/core-parity.cjs Grand-Tour-V24.html Grand-Tour-V25.html /tmp/gt-v25-evidence/core.json
          node tests/v25/focused.cjs Grand-Tour-V25.html archive/v22/Grand-Tour-V22.html /tmp/gt-v25-evidence/focused.json
          node tests/v24/save-finish-boundary.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/boundary.json
          node tests/v23/storage-ownership.cjs Grand-Tour-V25.html
          node tests/v23/ttt-wheel.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/ttt.json
          node tests/v25/storage-first-settings.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/first-settings.json
          node tests/v25/storage-validation.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/storage.json /tmp/gt-v25-evidence/fixtures
          node tests/v25/simulation-live-standings.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/live.json
          node tests/v25/render-continuity.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/continuity.json
          node tests/v25/render-score-parity.cjs Grand-Tour-V24.html Grand-Tour-V25.html /tmp/gt-v25-evidence/score.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-v25-gates
          path: /tmp/gt-v25-evidence
  tour-v24:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      # The simulation is deterministic: the same game file, scripts and seed always give the
      # same result. Reuse the saved result when none of them changed; any change to the game
      # file or the simulation scripts misses the cache and runs the full 21-stage simulation
      # again. The seed is part of the key: change it here and in the command together.
      - uses: actions/cache@v4
        id: tour-cache
        with:
          path: /tmp/gt-v25-evidence/v24*.json
          key: gt-tour-v24-seed314159-${{ hashFiles('Grand-Tour-V24.html', 'tests/v23/*.cjs') }}
      - name: Complete V24 Tour (seed 314159)
        if: steps.tour-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/gt-v25-evidence
          node tests/v23/tour-simulation.cjs Grand-Tour-V24.html /tmp/gt-v25-evidence/v24.json 314159
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-v24
          path: /tmp/gt-v25-evidence/v24*.json
  tour-v25:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      # The simulation is deterministic: the same game file, scripts and seed always give the
      # same result. Reuse the saved result when none of them changed; any change to the game
      # file or the simulation scripts misses the cache and runs the full 21-stage simulation
      # again. The seed is part of the key: change it here and in the command together.
      - uses: actions/cache@v4
        id: tour-cache
        with:
          path: /tmp/gt-v25-evidence/v25*.json
          key: gt-tour-v25-seed314159-${{ hashFiles('Grand-Tour-V25.html', 'tests/v23/*.cjs') }}
      - name: Complete V25 Tour (seed 314159)
        if: steps.tour-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/gt-v25-evidence
          node tests/v23/tour-simulation.cjs Grand-Tour-V25.html /tmp/gt-v25-evidence/v25.json 314159
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-v25
          path: /tmp/gt-v25-evidence/v25*.json
  compare:
    needs: [tour-v24, tour-v25]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: tour-*
          merge-multiple: true
          path: /tmp/gt-v25-evidence
      - name: Both complete Tours with exact V9 object parity
        run: |
          node tests/v25/simulation-tour-parity.cjs /tmp/gt-v25-evidence/v24-tour.json /tmp/gt-v25-evidence/v25-tour.json /tmp/gt-v25-evidence/v24.json /tmp/gt-v25-evidence/v25.json /tmp/gt-v25-evidence/tour-parity.json
          node tests/v25/full-tour-compatibility.cjs Grand-Tour-V24.html Grand-Tour-V25.html /tmp/gt-v25-evidence/v24-tour.json /tmp/gt-v25-evidence/full-tour-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-v25-compare
          path: /tmp/gt-v25-evidence
  native:
    needs: [gates, tour-v25]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - uses: actions/download-artifact@v4
        with:
          name: gt-v25-gates
          path: /tmp/gt-v25-evidence
      - uses: actions/download-artifact@v4
        with:
          name: tour-v25
          path: /tmp/gt-v25-evidence
      - name: Native browser, storage and presentation
        run: |
          python tests/v25/storage-first-settings-browser.py --source Grand-Tour-V25.html --validation-fixtures /tmp/gt-v25-evidence/fixtures --out /tmp/gt-v25-evidence/storage-browser
          python tests/v24/browser_verify.py --source Grand-Tour-V25.html --out /tmp/gt-v25-evidence/browser
          python tests/v25/ui_verify.py --out /tmp/gt-v25-evidence/ui
          python tests/v25/legacy_browser.py presentation --out /tmp/gt-v25-evidence/presentation
          python tests/v25/ceremony-transport-browser.py --out /tmp/gt-v25-evidence/ceremony-transport
          python tests/v25/legacy_browser.py sequence --record /tmp/gt-v25-evidence/browser/stage-05-physical.json --tour /tmp/gt-v25-evidence/v25-tour.json --out /tmp/gt-v25-evidence/sequence
      - name: Build and actually play the extracted offline source package
        run: |
          python tests/v25/package_source.py --out /tmp/gt-v25-evidence/Grand-Tour-V25-Source.zip
          python tests/v25/package_verify.py /tmp/gt-v25-evidence/Grand-Tour-V25-Source.zip --out /tmp/gt-v25-evidence/package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-v25-native
          path: /tmp/gt-v25-evidence
  candidate:
    needs: [gates, tour-v24, tour-v25, compare, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.gates.result }} ${{ needs.tour-v24.result }} ${{ needs.tour-v25.result }} ${{ needs.compare.result }} ${{ needs.native.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success || exit 1; done
